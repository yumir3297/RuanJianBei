services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: scenic_guide
      POSTGRES_USER: scenic_guide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/runtime.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenic_guide -d scenic_guide"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: postgresql+asyncpg://scenic_guide:${POSTGRES_PASSWORD}@postgres:5432/scenic_guide
    depends_on:
      postgres:
        condition: service_healthy

  tool-worker:
    environment:
      DATABASE_URL: postgresql+asyncpg://scenic_guide:${POSTGRES_PASSWORD}@postgres:5432/scenic_guide
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    environment:
      DATABASE_URL: postgresql+asyncpg://scenic_guide:${POSTGRES_PASSWORD}@postgres:5432/scenic_guide
    depends_on:
      postgres:
        condition: service_healthy

  initialize:
    environment:
      DATABASE_URL: postgresql+asyncpg://scenic_guide:${POSTGRES_PASSWORD}@postgres:5432/scenic_guide
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
