server {
    listen 80 default_server;
    server_name _ guide.local;
    root /var/www/tourist/current;
    index index.html;

    client_max_body_size 55m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /ui-assets/ { proxy_pass http://api:8000; }
    location = /health { proxy_pass http://api:8000; }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /offline-precache-manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /offline.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ^~ /offline/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

