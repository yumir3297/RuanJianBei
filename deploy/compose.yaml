name: scenic-guide

x-backend: &backend
  image: scenic-guide-backend:${RELEASE_TAG:-candidate}
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
    args:
      SOURCE_SHA: ${SOURCE_SHA:?pin SOURCE_SHA to the backend source commit}
  env_file:
    - path: runtime.env
      required: true
  environment: &backend-environment
    APP_HOST: 0.0.0.0
    APP_PORT: 8000
    AUTO_MIGRATE_ON_STARTUP: "false"
    BOOTSTRAP_ON_STARTUP: "false"
    SERVE_FRONTEND: "false"
    PROCESSED_DATA_DIR: /app/data/processed
    CHROMA_PERSIST_DIR: /var/lib/scenic-guide/chroma
    MODEL_CACHE_DIR: /var/cache/huggingface
    ASR_UPLOAD_DIR: /var/lib/scenic-guide/uploads/asr
    KNOWLEDGE_UPLOAD_DIR: /var/lib/scenic-guide/uploads/knowledge
    UI_ASSET_UPLOAD_DIR: /var/lib/scenic-guide/uploads/ui-assets
    UI_ASSET_MANIFEST_PATH: /var/lib/scenic-guide/config/display_assets.json
  volumes:
    - ${APP_STATE_ROOT:-../var/lib/scenic-guide}:/var/lib/scenic-guide
    - model-cache:/var/cache/huggingface
  networks: [private]

services:
  gateway:
    image: nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
    volumes:
      - ${NGINX_CONFIG_ROOT:?render target-specific NGINX config first}/tourist.conf:/etc/nginx/conf.d/tourist.conf:ro
      - ${NGINX_CONFIG_ROOT:?render target-specific NGINX config first}/admin.conf:/etc/nginx/conf.d/admin.conf:ro
      - ${NGINX_CONFIG_ROOT:?render target-specific NGINX config first}/tourist-api-map.conf:/etc/nginx/conf.d/tourist-api-map.conf:ro
      - ${NGINX_CONFIG_ROOT:?render target-specific NGINX config first}/admin-api-map.conf:/etc/nginx/conf.d/admin-api-map.conf:ro
      - ${NGINX_CONFIG_ROOT:?render target-specific NGINX config first}/snippets:/etc/nginx/snippets:ro
      - ${TOURIST_WEB_ROOT:-../var/www/tourist}:/var/www/tourist:ro
      - ${ADMIN_WEB_ROOT:-../var/www/admin}:/var/www/admin:ro
    networks: [private]
    restart: unless-stopped

  api:
    <<: *backend
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  tool-worker:
    <<: *backend
    command: ["python", "-m", "app.services.tool_execution.worker", "--worker-id", "compose-tool-worker"]
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "-m", "app.cli.deployment", "migrate"]
    profiles: [maintenance]
    restart: "no"

  initialize:
    <<: *backend
    command: ["python", "-m", "app.cli.deployment", "initialize"]
    profiles: [maintenance]
    restart: "no"

volumes:
  model-cache:

networks:
  private:
    driver: bridge
