<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400" role="img" aria-label="景区离线示意图占位：未经核验，不可用于救援导航">
  <title>景区离线示意图（未核验占位）</title>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ded2b8" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1000" height="1400" fill="#f4eddc" />
  <rect width="1000" height="1400" fill="url(#grid)" opacity="0.8" />
  <rect x="30" y="30" width="940" height="1340" rx="10" fill="none" stroke="#242b26" stroke-width="2" opacity="0.55" />
  <rect x="44" y="44" width="912" height="1312" rx="6" fill="none" stroke="#c39a5c" stroke-width="1" opacity="0.7" />

  <g font-family="Songti SC, Noto Serif SC, STSong, serif">
    <text x="500" y="150" text-anchor="middle" font-size="58" font-weight="700" fill="#242b26" letter-spacing="10">灵山胜境</text>
    <text x="500" y="200" text-anchor="middle" font-size="22" fill="#74836f" letter-spacing="6">离线示意图 · 未核验占位</text>

    <g transform="translate(140 280)" fill="none" stroke="#55685c" stroke-width="2.5">
      <circle cx="0" cy="0" r="40" opacity="0.55" />
      <circle cx="0" cy="0" r="28" opacity="0.35" />
      <path d="M0 -32 L7 0 L0 32 L-7 0 Z" fill="#b4462f" stroke="none" />
      <text x="0" y="-52" text-anchor="middle" font-size="20" fill="#242b26" stroke="none">北</text>
    </g>

    <g fill="#b4462f" opacity="0.16" font-size="44" font-weight="700" letter-spacing="10">
      <text x="500" y="500" text-anchor="middle">未核验示意图</text>
      <text x="500" y="580" text-anchor="middle">不可用于救援导航</text>
    </g>

    <rect x="150" y="680" width="700" height="250" rx="8" fill="#fbf6ea" stroke="#c39a5c" stroke-width="1.5" stroke-dasharray="9 7" />
    <text x="500" y="752" text-anchor="middle" font-size="30" font-weight="700" fill="#8e3323">本图不含经核验的景点与设施点位</text>
    <text x="500" y="804" text-anchor="middle" font-size="23" fill="#4c5a50">尚未获得可合法离线分发的景区简图</text>
    <text x="500" y="852" text-anchor="middle" font-size="23" fill="#4c5a50">出入口、服务台、卫生间、医疗点均为空缺</text>

    <text x="500" y="1270" text-anchor="middle" font-size="22" fill="#74836f">景区示意图，实际以现场指示及工作人员为准</text>

    <rect x="446" y="1298" width="108" height="44" rx="6" fill="#b4462f" />
    <text x="500" y="1328" text-anchor="middle" font-size="22" fill="#fbf6ea" letter-spacing="4">未核验</text>
  </g>
</svg>
